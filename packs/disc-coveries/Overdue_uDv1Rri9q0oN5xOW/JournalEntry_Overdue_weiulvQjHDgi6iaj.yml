      content: >-
        <ul style="margin-top:0cm"><li class="MsoNormal" style="mso-list:l0
        level1 lfo1;tab-stops:list 36.0pt"><p>This adventure leans on comic
        escalation, not danger. Keep threats present but rarely lethal; the
        horror-adjacent elements (Sconce's fate, L-Space's vastness) work best
        played as unsettling rather than grim.</p></li><li class="MsoNormal"
        style="mso-list:l0 level1 lfo1;tab-stops:list 36.0pt"><p>The random
        fragment table in Act 3 is a good spot to let players improvise freely,
        reward creative interpretations of the effects.</p></li><li
        class="MsoNormal" style="mso-list:l0 level1 lfo1;tab-stops:list
        36.0pt"><p>Sconce's resolution scene is designed to reward whatever the
        party actually did during investigation, if they skipped Scene A or C,
        adjust how much "finish the sentence" material is available, and lean
        more on the Persuasion route instead.</p></li></ul>

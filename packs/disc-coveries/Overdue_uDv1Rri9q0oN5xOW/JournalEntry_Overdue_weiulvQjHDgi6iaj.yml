  - sort: 1000000
    name: Locations
    type: text
    _id: xkLI9dn0Dbnlb7DS
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>Locations</strong></p><ul style="margin-top:0cm"><li
        class="MsoNormal" style="mso-list:l0 level1 lfo1;tab-stops:list
        36.0pt"><p><strong>The Library / L-Space approach</strong> - as strange
        and vast as your table enjoys; a good place to remind everyone of the
        setting's scale.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p><strong>Sconce's rooms</strong> -
        cluttered, academic, faintly wrong.</p></li><li class="MsoNormal"
        style="mso-list:l0 level1 lfo1;tab-stops:list 36.0pt"><p><strong>The
        Reordered Wing</strong> - the session's centrepiece set-piece; encourage
        improvisation here.</p></li><li class="MsoNormal" style="mso-list:l0
        level1 lfo1;tab-stops:list 36.0pt"><p><strong>A city street or
        two</strong> - for comic relief and pacing breathers between the weirder
        scenes.</p></li></ul>
    video:

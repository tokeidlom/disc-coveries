  - sort: 1100000
    name: Optional Scenes (for a longer session)
    type: text
    _id: l8AKKOE0aUeJMNCs
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <ul style="margin-top:0cm"><li class="MsoNormal" style="mso-list:l0
        level1 lfo1;tab-stops:list 36.0pt"><p><strong>The Faculty
        Meeting</strong>, played for laughs, where the party must extract
        permission or information from squabbling professors before they're
        allowed to act.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p><strong>A second reordered
        location</strong> in the city itself, a shop, a bridge, a small square
        that's begun exhibiting the same fold-in effect, raising the stakes
        before the party reaches the University's own wing.</p></li><li
        class="MsoNormal" style="mso-list:l0 level1 lfo1;tab-stops:list
        36.0pt"><p><strong>A rival attempt</strong> - another faculty member
        trying to "handle it" themselves first, badly, giving the party a mess
        to clean up on arrival.</p></li></ul>

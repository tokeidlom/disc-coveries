name: Overdue
_id: weiulvQjHDgi6iaj
pages:
  - sort: 100000
    name: Premise
    type: text
    _id: NlQnEy2BoMSnnIxN
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>A book is late back to the Library. This would normally be enough to
        upset the Librarian, except that in addition:</p><ol
        style="margin-top:0cm" type="1"><li class="MsoNormal" style="mso-list:l0
        level1 lfo1;tab-stops:list 36.0pt"><p>The book in question is
        <em>Certain Proceedings of a Cumulative Nature</em>, a grimoire so dense
        with stored thaumic potential that the Librarian keeps it chained, and
        warded.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p>The borrower, one Dr. Nivor Sconce,
        hasn't been seen in nine days, and his rooms are locked from the
        inside.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p>Small, localised bits of geography around
        Ankh-Morpork have started appearing in the wrong order.</p></li></ol><p
        class="MsoNormal">The Librarian wants his book back. The Archchancellor
        wants the embarrassing whiff of "unauthorised research" to go away
        quietly. And the player characters, junior wizards, University
        hangers-on, or whoever else can plausibly be sent to do something nobody
        senior wants to be blamed for, are the ones sent to fetch it.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    flags: {}
    _stats:
      compendiumSource: null
      duplicateSource: null

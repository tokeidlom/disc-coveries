  - sort: 600000
    name: 'Act 3: The Reordered Wing'
    type: text
    _id: i20gf3XlIJAVtTuw
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Following the trail (or the recalled "shelf-shadow") leads the party
        into a stretch of University corridor that has been folded into
        something closer to L-Space than architecture. Doors open onto the wrong
        rooms. Staircases loop. A postbox appears halfway up a wall.</p><p
        class="MsoNormal">This is a set-piece exploration scene, not a straight
        combat. Suggested beats:</p><ul style="margin-top:0cm"><li
        class="MsoNormal" style="mso-list:l0 level1 lfo1;tab-stops:list
        36.0pt"><p><strong>A room that repeats</strong> - the party must
        recognise a subtle changing detail each time they pass through to know
        they're making progress, not looping.</p></li><li class="MsoNormal"
        style="mso-list:l0 level1 lfo1;tab-stops:list 36.0pt"><p><strong>A
        corridor of half-finished sentences</strong> - fragments of <em>Certain
        Proceedings</em> drift past as motes of light or muttering voices;
        reading one aloud has a minor magical effect (a good spot for a random
        table - see below).</p></li><li class="MsoNormal" style="mso-list:l0
        level1 lfo1;tab-stops:list 36.0pt"><p><strong>A guardian
        obstacle</strong>, optional: something the book has "misfiled" nearby -
        a gargoyle now catalogued as furniture, an overly officious index card
        golem insisting on being checked out properly before anyone can
        pass.</p></li></ul><p></p><p>@UUID[RollTable.5BbJmGfkJlLvHIwL]{Overdue,
        Act 3, Fragment Effects}</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    flags: {}
    _stats:
      compendiumSource: null
      duplicateSource: null
      exportSource: null
      coreVersion: '13.351'
      systemId: discworld
      systemVersion: 1.6.2
      createdTime: 1786097413039
      modifiedTime: 1786097965868
      lastModifiedBy: SxcTMbeoYHfiUGJA
    ownership:
      default: -1
  - sort: 700000
    name: 'Act 4: Sconce, and the Book'
    type: text
    _id: 093aGsZMJGNjrssB
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: "<p>At the heart of the reordered wing, the party finds Dr. Sconce - mid-sentence, mid-page, partially merged into the book, entirely convinced he's about to have his breakthrough. He is not in danger by his own reckoning and will be mildly annoyed at the interruption.</p><p class=\"MsoNormal\"><strong>The puzzle:</strong> the book cannot simply be slammed shut with Sconce still part-embedded in it - <span style=\"mso-spacerun:yes\">\_</span>that's how you get a Sconce-shaped bookmark. He needs to be talked, tricked, or (if someone's clever) <em>narratively</em> extracted - finishing the sentence he's stuck on, giving him a satisfying enough \"ending\" that the book considers the chapter closed and releases him.</p><p class=\"MsoNormal\"><strong>Ways this can go, depending on party approach:</strong></p><ul style=\"margin-top:0cm\"><li class=\"MsoNormal\" style=\"mso-list:l0 level1 lfo1;tab-stops:list 36.0pt\"><p><strong>Talk him down</strong>: Convince him the \"answer\" he's looking for isn't in the next sentence - a Persuasion/Empathy-style challenge, complicated by his very wizardly stubbornness.</p></li><li class=\"MsoNormal\" style=\"mso-list:l0 level1 lfo1;tab-stops:list 36.0pt\"><p><strong>Finish the sentence for him</strong>: If the party pieced together fragments from Act 3, they may have enough of the missing text to complete it themselves, tricking the book into thinking the paragraph is done.</p></li><li class=\"MsoNormal\" style=\"mso-list:l0 level1 lfo1;tab-stops:list 36.0pt\"><p><strong>Force the book shut anyway</strong>: Possible, but risks a comic-magical mishap - Sconce partially transposed with something else nearby (a gargoyle, a teapot, the Bursar) for the rest of the session, to be undone \"off-screen\" by the Faculty later. Great if your table wants a farcical ending rather than a clean one.</p></li></ul><p><span style=\"font-size:12.0pt;line-height:115%;font-family:'Calibri', sans-serif;mso-ascii-theme-font:minor-latin;mso-fareast-font-family:Calibri;mso-fareast-theme-font:minor-latin;mso-hansi-theme-font:minor-latin;mso-bidi-font-family:'Times New Roman';mso-bidi-theme-font:minor-bidi;mso-ansi-language:EN-GB;mso-fareast-language:EN-US;mso-bidi-language:AR-SA\">Once resolved, the reordered wing folds itself back into normal geometry over the next several minutes - corridors sliding back, the pub presumably relieved to lose its river view.</span></p>"
    video:
      controls: true
      volume: 0.5
    src: null
    category: null

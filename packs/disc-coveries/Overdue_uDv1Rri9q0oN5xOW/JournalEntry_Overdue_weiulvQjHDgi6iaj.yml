  - sort: 900000
    name: Key NPCs
    type: text
    _id: SGAAnzHLEPmLs86K
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p><strong>The Librarian</strong> - Wants his book back, unimpressed by
        everyone, communicates mostly through gesture and the occasional "Ook."
        Genuinely dangerous if crossed, genuinely helpful if respected.
        Oook!</p><p class="MsoNormal"><strong>Dr. Nivor Sconce</strong> - Minor
        faculty member, thirty years chasing tenure, absolutely certain the next
        sentence changes everything. Not malicious, just monomaniacally
        stubborn. Plays well as pitiable-but-exasperating.</p><p
        class="MsoNormal"><strong>The Bursar</strong> (or an original stand-in,
        if you'd rather not use a named canon character directly) - Overworked,
        easily flustered, first to notice the furniture swap and last to be
        believed about it.</p><p class="MsoNormal"><strong>A Rival Faculty
        Member</strong> - Invented to taste; someone who'd rather the party fail
        quietly so they can take credit for "solving" it themselves. Good source
        of Act 1 friction and a possible Act 5 complication.</p>
    video:
      controls: true
      volume: 0.5
    src: null

  - sort: 400000
    name: 'Act 1: The Briefing'
    type: text
    _id: 1DJKWqBpWfannQfp
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>The party is summoned, separately or together, to the Librarian, a
        wizard is there to translate, unless a party member wants to play that
        role, the wizard could be Rincewind at the GM discretion.</p><p
        class="MsoNormal"><strong>Key information to deliver:</strong></p><ul
        style="margin-top:0cm"><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p>Dr. Sconce hasn't been seen in nine
        days.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p>His door is locked from the inside;
        nobody wants to break it down without permission from someone who
        outranks them, and nobody outranking them wants to be associated with
        this.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p>The Librarian is <em>quietly
        furious,</em> it's rare for him to specifically ask for outside help,
        which itself should worry the players.</p></li><li class="MsoNormal"
        style="mso-list:l0 level1 lfo1;tab-stops:list 36.0pt"><p>Small oddities
        have been reported: a corridor that now dead-ends where it used to turn,
        the Bursar's office chair swapped with one from a room two floors up,
        with the Bursar still in it.</p></li></ul><p
        class="MsoNormal"><strong>GM Tip:</strong> Let the party bicker about
        who's actually in charge of this errand. That squabbling <em>is</em> the
        wizard experience.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    flags: {}
    _stats:
      compendiumSource: null
      duplicateSource: null
      exportSource: null
      coreVersion: '13.351'
      systemId: discworld

  - sort: 800000
    name: 'Act 5: Fallout'
    type: text
    _id: nqH9c3oedRpyzaHG
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Suggested wrap-up beats:</p><ul style="margin-top:0cm"><li
        class="MsoNormal" style="mso-list:l0 level1 lfo1;tab-stops:list
        36.0pt"><p>The Librarian re-shelves <em>Certain Proceedings</em> with a
        new, more severe warding, and makes a point of remembering who caused
        the extra paperwork.</p></li><li class="MsoNormal" style="mso-list:l0
        level1 lfo1;tab-stops:list 36.0pt"><p>The Archchancellor is satisfied so
        long as nobody mentions this to the Patrician or the
        newspapers.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo1;tab-stops:list 36.0pt"><p>Sconce is quietly reassigned to a subject
        with fewer syllables and no dangerous grimoires - possibly as
        comic-relief NPC fodder for a future session.</p></li><li
        class="MsoNormal" style="mso-list:l0 level1 lfo1;tab-stops:list
        36.0pt"><p>If the party botched the extraction, resolve the lingering
        weirdness (Bursar with a slightly gargoyle-ish demeanour, etc.) as a
        running joke or hook for next time.</p></li></ul>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    flags: {}
    _stats:
      compendiumSource: null
      duplicateSource: null
      exportSource: null

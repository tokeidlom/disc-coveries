  - sort: 200000
    name: The Truth (for the GM only)
    type: text
    _id: 22zivqRfsxouA7nG
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Sconce wasn't researching anything sanctioned. He borrowed
        <em>Certain Proceedings</em> to finish reading a page he'd started
        thirty years ago as a student, convinced the rest of the sentence
        contained the secret to a spell that would finally get him tenure. The
        book doesn't like being read out of order. It has started reordering
        things nearby, his room, his corridor, and now creeping out into the
        city, one relocated cobblestone and rearranged shopfront at a
        time.</p><p class="MsoNormal">Sconce himself isn't dead. He's stuck
        <em>mid-paragraph,</em> literally embedded partway through the book,
        stuck out of time, entirely certain that everything is going according
        to plan. Finding him is easy. Talking sense into him is the actual
        puzzle. Getting the book closed on him without ripping him in half is
        the actual climax.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null

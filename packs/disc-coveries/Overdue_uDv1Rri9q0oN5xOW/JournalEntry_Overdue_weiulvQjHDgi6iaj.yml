  - sort: 300000
    name: Structure (4 - 6 hours)
    type: text
    _id: DhSxmZ721Rz4sf2K
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <table class="MsoNormalTable" border="0"
        style="mso-cellspacing:1.5pt;mso-yfti-tbllook:1184"><thead><tr
        style="mso-yfti-irow:0;mso-yfti-firstrow:yes"><td style="padding:.75pt
        .75pt .75pt .75pt"><p class="MsoNormal"><strong>Act</strong></p></td><td
        style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal"><strong>Content</strong></p></td><td
        style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal"><strong>Time</strong></p></td></tr></thead><tbody><tr
        style="mso-yfti-irow:1"><td style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">1</p></td><td style="padding:.75pt .75pt .75pt
        .75pt"><p class="MsoNormal">Briefing &amp; first clues</p></td><td
        style="padding:.75pt .75pt .75pt .75pt"><p class="MsoNormal">30 - 45
        min</p></td></tr><tr style="mso-yfti-irow:2"><td style="padding:.75pt
        .75pt .75pt .75pt"><p class="MsoNormal">2</p></td><td
        style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">Investigation across the University and
        city</p></td><td style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">1.5 - 2 hr</p></td></tr><tr
        style="mso-yfti-irow:3"><td style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">3</p></td><td style="padding:.75pt .75pt .75pt
        .75pt"><p class="MsoNormal">The reordered wing / L-Space
        incursion</p></td><td style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">1 - 1.5 hr</p></td></tr><tr
        style="mso-yfti-irow:4"><td style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">4</p></td><td style="padding:.75pt .75pt .75pt
        .75pt"><p class="MsoNormal">Confronting Sconce &amp; closing the
        book</p></td><td style="padding:.75pt .75pt .75pt .75pt"><p
        class="MsoNormal">1 - 1.5 hr</p></td></tr><tr
        style="mso-yfti-irow:5;mso-yfti-lastrow:yes"><td style="padding:.75pt
        .75pt .75pt .75pt"><p class="MsoNormal">5</p></td><td
        style="padding:.75pt .75pt .75pt .75pt"><p class="MsoNormal">Fallout
        &amp; consequences</p></td><td style="padding:.75pt .75pt .75pt
        .75pt"><p class="MsoNormal">15 - 30 min</p></td></tr></tbody></table><p
        class="MsoNormal">Cut Act 2 shorter for a 4-hour game by trimming to two
        investigation scenes instead of three. Stretch Act 3 for a 6-hour game
        by adding an extra reordered location (see <strong>Optional
        Scenes</strong> below).</p>

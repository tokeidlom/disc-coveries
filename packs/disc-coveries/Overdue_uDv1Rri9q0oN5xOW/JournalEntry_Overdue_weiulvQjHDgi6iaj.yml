  - sort: 500000
    name: 'Act 2: Investigation'
    type: text
    _id: RnUWvDkTjktxUNaG
    system: {}
    title:
      show: true
      level: 1
    image: {}
    text:
      format: 1
      content: >-
        <p>Three scenes the party can tackle in any order. Each yields a piece
        of the puzzle.</p><p class="MsoNormal"><strong>Scene A - Sconce's
        Rooms</strong></p><p class="MsoNormal">The door is locked, but the room
        isn't quite where it should be anymore, the door now looks out onto a
        corridor that shouldn't exist on that side of the building. Breaking in
        (by force, magic, or bribing a bursary clerk for the spare key nobody's
        supposed to have) reveals:</p><ul style="margin-top:0cm"><li
        class="MsoNormal" style="mso-list:l1 level1 lfo1;tab-stops:list
        36.0pt"><p>Notes in Sconce’s hand on <em>Certain Proceedings</em>,
        chapter titles growing steadily stranger and more
        self-referential.</p></li><li class="MsoNormal" style="mso-list:l1
        level1 lfo1;tab-stops:list 36.0pt"><p>A half-eaten meal, nine days stale
        but somehow not rotten, time isn't behaving normally in
        here.</p></li><li class="MsoNormal" style="mso-list:l1 level1
        lfo1;tab-stops:list 36.0pt"><p>A <strong>trail</strong>: footprints that
        lead to the far wall and simply stop, as if someone walked <em>into</em>
        the bookshelf.</p></li></ul><p class="MsoNormal"><strong>Scene B — The
        Librarian's Domain</strong></p><p class="MsoNormal">A trip into L-Space
        itself (with all appropriate warnings and the Librarian's characteristic
        patience for people who touch things). The party can:</p><ul
        style="margin-top:0cm"><li class="MsoNormal" style="mso-list:l2 level1
        lfo2;tab-stops:list 36.0pt"><p>Learn that <em>Certain Proceedings</em>
        was checked out entirely properly, which is the most alarming
        part.</p></li><li class="MsoNormal" style="mso-list:l2 level1
        lfo2;tab-stops:list 36.0pt"><p>Discover the book's "shelf-shadow", a
        faint impression showing it's still <em>linked</em> to its proper place,
        meaning it can theoretically be recalled.</p></li><li class="MsoNormal"
        style="mso-list:l2 level1 lfo2;tab-stops:list 36.0pt"><p>Get bitten,
        mildly, if someone is rude about the overdue fine.</p></li></ul><p
        class="MsoNormal"><strong>Scene C — Out in the City</strong></p><p
        class="MsoNormal">Ankh-Morpork has noticed. A few options to mix comedy
        with clues:</p><ul style="margin-top:0cm"><li class="MsoNormal"
        style="mso-list:l0 level1 lfo3;tab-stops:list 36.0pt"><p>A pub that's
        now two streets further from the river than it was last week, much to
        the confusion (and profit, if they charge for the novelty) of its
        landlord.</p></li><li class="MsoNormal" style="mso-list:l0 level1
        lfo3;tab-stops:list 36.0pt"><p>A Watch patrol investigating a house
        whose front door now opens onto its own back garden.</p></li><li
        class="MsoNormal" style="mso-list:l0 level1 lfo3;tab-stops:list
        36.0pt"><p>A street vendor selling "guaranteed fixed-position" pies,
        capitalising on the chaos.</p></li></ul><p class="MsoNormal">Each city
        vignette can include an NPC who mentions increasingly strange sightings
        near the University, subtly herding the party back toward Act 3.</p>
    video:
      controls: true
      volume: 0.5
    src: null
    category: null
    flags: {}
    _stats:
      compendiumSource: null
      duplicateSource: null
      exportSource: null

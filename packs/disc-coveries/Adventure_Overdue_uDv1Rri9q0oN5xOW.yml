caption: A 'Discworld, Adventures in Ankh-Morpork' adventure by CalinStar
description: >-
  <p><strong>A Discworld RPG One-Shot for Unseen University</strong></p><p
  class="MsoNormal"><em>A 4 - 6 hour adventure of scholarship, cowardice, and
  things that shouldn't be read after dark.</em></p><p>A book is late back to
  the Library. The Librarian wants his book back. The Archchancellor wants the
  embarrassing whiff of "unauthorised research" to go away quietly. And the
  player characters, junior wizards, University hangers-on, or whoever else can
  plausibly be sent to do something nobody senior wants to be blamed for, are
  the ones sent to fetch it.</p>
